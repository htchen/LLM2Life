<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2240 1180" width="2240" height="1180" role="img" aria-label="AI 的演進與人的角色：人把對真實世界的理解變成紀錄，紀錄數位化後成為 AI 模型的訓練資料；控制電腦的方式從機器碼演進到自然語言，AI 模型把人話轉成指令；未來機器人自行蒐集第一手資訊回到真實世界；人仍是理解宇宙的一環。" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="26" fill="#14110e">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a534b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8442a"/></marker>
  </defs>
  <rect width="2240" height="1180" fill="#fbfaf8"/>

  <!-- 時間軸與分界 -->
  <line x1="70" y1="112" x2="2170" y2="112" stroke="#c9c2b8" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="70" y="80" font-size="24" fill="#7a7168">遠古</text>
  <text x="1090" y="80" font-size="24" fill="#7a7168" text-anchor="middle">電腦發明</text>
  <text x="1660" y="80" font-size="24" fill="#7a7168" text-anchor="middle">現在</text>
  <text x="2085" y="80" font-size="24" fill="#7a7168" text-anchor="middle">未來</text>
  <line x1="1090" y1="128" x2="1090" y2="960" stroke="#c9c2b8" stroke-width="2.5" stroke-dasharray="10 10"/>
  <line x1="1660" y1="128" x2="1660" y2="960" stroke="#c9c2b8" stroke-width="2.5" stroke-dasharray="10 10"/>

  <!-- 車道標籤 -->
  <text x="590" y="196" font-size="24" fill="#7a7168">紀錄與傳遞</text>
  <text x="1110" y="710" font-size="24" fill="#7a7168">控制電腦的方式</text>

  <!-- 真實世界 -->
  <circle cx="140" cy="520" r="86" fill="#efece7" stroke="#5a534b" stroke-width="3"/>
  <text x="140" y="513" text-anchor="middle" font-size="28" font-weight="700">真實世界</text>
  <text x="140" y="548" text-anchor="middle" font-size="22" fill="#5a534b">宇宙</text>

  <!-- 人 -->
  <rect x="310" y="465" width="180" height="110" rx="14" fill="#fff" stroke="#b8442a" stroke-width="3.5"/>
  <text x="400" y="513" text-anchor="middle" font-size="32" font-weight="700" fill="#b8442a">人</text>
  <text x="400" y="551" text-anchor="middle" font-size="22" fill="#b8442a">理解</text>
  <line x1="226" y1="520" x2="308" y2="520" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <path d="M310 482 C 262 436, 200 432, 166 440" fill="none" stroke="#b8442a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="240" y="420" text-anchor="middle" font-size="21" fill="#b8442a">繼續探索</text>

  <!-- 上車道：紀錄 -->
  <g stroke="#5a534b" stroke-width="3" fill="#fff">
    <rect x="590" y="228" width="200" height="86" rx="12"/>
    <rect x="830" y="228" width="230" height="86" rx="12" stroke="#a9a196"/>
    <rect x="1130" y="224" width="230" height="94" rx="12" fill="#efece7"/>
  </g>
  <text x="690" y="265" text-anchor="middle" font-size="24" font-weight="700">書、畫、口傳</text>
  <text x="690" y="296" text-anchor="middle" font-size="19" fill="#5a534b">代代相傳的知識</text>
  <text x="945" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#7a7168">留聲機、唱片、底片</text>
  <text x="945" y="296" text-anchor="middle" font-size="19" fill="#a9a196">類比紀錄</text>
  <text x="1245" y="262" text-anchor="middle" font-size="24" font-weight="700">數位資料</text>
  <text x="1245" y="296" text-anchor="middle" font-size="19" fill="#5a534b">文字、影像、影片</text>
  <path d="M490 494 C 530 330, 545 271, 588 271" fill="none" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <text x="505" y="362" font-size="21" fill="#5a534b">記錄、傳遞</text>
  <line x1="792" y1="271" x2="828" y2="271" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1062" y1="271" x2="1128" y2="271" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <text x="1095" y="256" text-anchor="middle" font-size="18" fill="#5a534b">數位化</text>
  <path d="M1362 271 C 1520 271, 1580 412, 1716 428" fill="none" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <text x="1500" y="300" font-size="21" fill="#5a534b">成為訓練資料</text>
  <path d="M1716 458 C 1560 458, 1450 336, 1362 300" fill="none" stroke="#5a534b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#a)"/>
  <text x="1430" y="418" font-size="19" fill="#5a534b">電腦也產生數位資料</text>

  <!-- 下車道：控制 -->
  <g stroke="#5a534b" stroke-width="3" fill="#fff">
    <rect x="1110" y="748" width="130" height="86" rx="12" stroke="#a9a196"/>
    <rect x="1260" y="748" width="140" height="86" rx="12" stroke="#a9a196"/>
    <rect x="1420" y="748" width="110" height="86" rx="12" stroke="#a9a196"/>
    <rect x="1550" y="748" width="150" height="86" rx="12" stroke="#a9a196"/>
    <rect x="1740" y="748" width="190" height="86" rx="12" stroke="#b8442a" stroke-width="3.5"/>
  </g>
  <text x="1175" y="800" text-anchor="middle" font-size="24" font-weight="700" fill="#7a7168">機器碼</text>
  <text x="1330" y="800" text-anchor="middle" font-size="24" font-weight="700" fill="#7a7168">組合語言</text>
  <text x="1475" y="800" text-anchor="middle" font-size="24" font-weight="700" fill="#7a7168">C 語言</text>
  <text x="1625" y="790" text-anchor="middle" font-size="23" font-weight="700" fill="#7a7168">高階語言</text>
  <text x="1625" y="818" text-anchor="middle" font-size="18" fill="#a9a196">經編譯器</text>
  <text x="1835" y="790" text-anchor="middle" font-size="26" font-weight="700" fill="#b8442a">自然語言</text>
  <text x="1835" y="818" text-anchor="middle" font-size="19" fill="#b8442a">直接說人話</text>
  <line x1="1242" y1="791" x2="1258" y2="791" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1402" y1="791" x2="1418" y2="791" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1532" y1="791" x2="1548" y2="791" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1702" y1="791" x2="1738" y2="791" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1113 856 L1113 868 L1698 868 L1698 856" fill="none" stroke="#a9a196" stroke-width="2.5"/>
  <text x="1405" y="896" text-anchor="middle" font-size="20" fill="#7a7168">中間過渡的知識——可被淘汰</text>
  <!-- 舊路徑：轉成指令直接進電腦 -->
  <path d="M1625 746 C 1625 660, 1680 612, 1716 612" fill="none" stroke="#5a534b" stroke-width="3" marker-end="url(#a)"/>
  <text x="1660" y="640" font-size="19" fill="#5a534b" text-anchor="end">轉成指令</text>
  <!-- 新路徑：人話進 AI 模型 -->
  <path d="M1835 746 C 1835 680, 1845 590, 1860 566" fill="none" stroke="#b8442a" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="1858" y="656" font-size="19" fill="#b8442a">聽懂人話</text>
  <!-- 人 → 自然語言 -->
  <path d="M400 577 L 400 930 L 1835 930 L 1835 836" fill="none" stroke="#b8442a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="760" y="920" text-anchor="middle" font-size="21" fill="#b8442a">人直接用人話控制電腦</text>

  <!-- 電腦：AI 模型 + 執行指令 -->
  <rect x="1720" y="372" width="230" height="292" rx="16" fill="#fff" stroke="#14110e" stroke-width="3.5"/>
  <line x1="1720" y1="552" x2="1950" y2="552" stroke="#14110e" stroke-width="2.5"/>
  <text x="1835" y="354" text-anchor="middle" font-size="23" fill="#5a534b">電腦</text>
  <text x="1835" y="440" text-anchor="middle" font-size="29" font-weight="700">AI 模型</text>
  <text x="1835" y="474" text-anchor="middle" font-size="19" fill="#5a534b">讀過全部紀錄</text>
  <text x="1835" y="501" text-anchor="middle" font-size="19" fill="#5a534b">把人話轉成指令</text>
  <line x1="1835" y1="518" x2="1835" y2="548" stroke="#b8442a" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="1835" y="616" text-anchor="middle" font-size="27" font-weight="700">執行指令</text>

  <!-- 機器人與迴圈 -->
  <rect x="2000" y="465" width="180" height="110" rx="14" fill="#fff" stroke="#5a534b" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="2090" y="513" text-anchor="middle" font-size="28" font-weight="700">機器人</text>
  <text x="2090" y="550" text-anchor="middle" font-size="19" fill="#5a534b">感測、行動</text>
  <line x1="1952" y1="520" x2="1998" y2="520" stroke="#5a534b" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#a)"/>
  <path d="M2090 577 L 2090 1000 L 140 1000 L 140 608" fill="none" stroke="#5a534b" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#a)"/>
  <text x="1110" y="988" text-anchor="middle" font-size="21" fill="#5a534b">未來：自己蒐集第一手資訊，與真實世界對應</text>

  <!-- 人的角色 -->
  <text x="1120" y="1078" text-anchor="middle" font-size="31" font-weight="700" fill="#b8442a">人仍是理解宇宙的一環——繼續探索，別浪費了大腦與身體這樣的寶藏</text>
  <text x="1120" y="1128" text-anchor="middle" font-size="25" fill="#5a534b">未來要學的，是理解宇宙的真理，以及人類思想與情感的基本要素；中間過渡的知識可以淘汰</text>
</svg>
