<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 990" width="1800" height="990" role="img" aria-label="AI 的演進與人的角色：人把對真實世界的理解變成紀錄，紀錄數位化後成為 AI 模型的訓練資料；控制電腦的方式從機器碼演進到自然語言，AI 模型把人話轉成指令；未來機器人自行蒐集第一手資訊回到真實世界；人仍是理解宇宙的一環。" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif" font-size="22" fill="#14110e">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a534b"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8442a"/></marker>
  </defs>
  <rect width="1800" height="990" fill="#fbfaf8"/>

  <!-- 時間軸與分界 -->
  <line x1="60" y1="96" x2="1740" y2="96" stroke="#c9c2b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="60" y="70" font-size="20" fill="#7a7168">遠古</text>
  <text x="820" y="70" font-size="20" fill="#7a7168" text-anchor="middle">電腦發明</text>
  <text x="1330" y="70" font-size="20" fill="#7a7168" text-anchor="middle">現在</text>
  <text x="1690" y="70" font-size="20" fill="#7a7168" text-anchor="middle">未來</text>
  <line x1="820" y1="110" x2="820" y2="810" stroke="#c9c2b8" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="1330" y1="110" x2="1330" y2="810" stroke="#c9c2b8" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- 車道標籤 -->
  <text x="470" y="176" font-size="20" fill="#7a7168">紀錄與傳遞</text>
  <text x="880" y="596" font-size="20" fill="#7a7168">控制電腦的方式</text>
  <path d="M852 712 L852 722 L1318 722 L1318 712" fill="none" stroke="#a9a196" stroke-width="2"/>
  <text x="1085" y="742" text-anchor="middle" font-size="15" fill="#7a7168">中間過渡的知識——可被淘汰</text>

  <!-- 真實世界 -->
  <circle cx="120" cy="450" r="72" fill="#efece7" stroke="#5a534b" stroke-width="2.5"/>
  <text x="120" y="443" text-anchor="middle" font-size="24" font-weight="700">真實世界</text>
  <text x="120" y="472" text-anchor="middle" font-size="18" fill="#5a534b">宇宙</text>

  <!-- 人 -->
  <rect x="255" y="405" width="150" height="90" rx="12" fill="#fff" stroke="#b8442a" stroke-width="3"/>
  <text x="330" y="443" text-anchor="middle" font-size="26" font-weight="700" fill="#b8442a">人</text>
  <text x="330" y="474" text-anchor="middle" font-size="18" fill="#b8442a">理解</text>
  <line x1="192" y1="450" x2="253" y2="450" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M255 420 C 215 385, 165 385, 140 378" fill="none" stroke="#b8442a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="200" y="366" text-anchor="middle" font-size="17" fill="#b8442a">繼續探索</text>

  <!-- 上車道：紀錄 -->
  <g stroke="#5a534b" stroke-width="2.5" fill="#fff">
    <rect x="485" y="205" width="150" height="70" rx="10"/>
    <rect x="650" y="205" width="160" height="70" rx="10" stroke="#a9a196" stroke-dasharray="none"/>
    <rect x="880" y="200" width="180" height="80" rx="10" fill="#efece7"/>
  </g>
  <text x="560" y="235" text-anchor="middle" font-size="20" font-weight="700">書、畫、口傳</text>
  <text x="560" y="259" text-anchor="middle" font-size="16" fill="#5a534b">代代相傳的知識</text>
  <text x="730" y="235" text-anchor="middle" font-size="18" font-weight="700" fill="#7a7168">留聲機、唱片、底片</text>
  <text x="730" y="259" text-anchor="middle" font-size="15" fill="#a9a196">類比紀錄</text>
  <text x="970" y="232" text-anchor="middle" font-size="20" font-weight="700">數位資料</text>
  <text x="970" y="258" text-anchor="middle" font-size="16" fill="#5a534b">文字、影像、影片</text>
  <path d="M405 430 C 440 300, 450 240, 483 240" fill="none" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="418" y="312" font-size="17" fill="#5a534b">記錄、傳遞</text>
  <line x1="637" y1="240" x2="648" y2="240" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="812" y1="240" x2="878" y2="240" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="845" y="226" text-anchor="middle" font-size="14" fill="#5a534b">數位化</text>
  <path d="M1062 240 C 1200 240, 1250 360, 1376 372" fill="none" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1190" y="262" font-size="17" fill="#5a534b">成為訓練資料</text>
  <path d="M1376 396 C 1250 396, 1150 300, 1062 262" fill="none" stroke="#5a534b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <text x="1140" y="358" font-size="15" fill="#5a534b">電腦也產生數位資料</text>

  <!-- 下車道：控制 -->
  <g stroke="#5a534b" stroke-width="2.5" fill="#fff">
    <rect x="850" y="625" width="100" height="70" rx="10" stroke="#a9a196"/>
    <rect x="970" y="625" width="110" height="70" rx="10" stroke="#a9a196"/>
    <rect x="1100" y="625" width="90" height="70" rx="10" stroke="#a9a196"/>
    <rect x="1210" y="625" width="110" height="70" rx="10" stroke="#a9a196"/>
    <rect x="1360" y="625" width="140" height="70" rx="10" stroke="#b8442a" stroke-width="3"/>
  </g>
  <text x="900" y="667" text-anchor="middle" font-size="20" font-weight="700" fill="#7a7168">機器碼</text>
  <text x="1025" y="667" text-anchor="middle" font-size="20" font-weight="700" fill="#7a7168">組合語言</text>
  <text x="1145" y="667" text-anchor="middle" font-size="20" font-weight="700" fill="#7a7168">C 語言</text>
  <text x="1265" y="660" text-anchor="middle" font-size="19" font-weight="700" fill="#7a7168">高階語言</text>
  <text x="1265" y="682" text-anchor="middle" font-size="15" fill="#a9a196">經編譯器</text>
  <text x="1430" y="660" text-anchor="middle" font-size="21" font-weight="700" fill="#b8442a">自然語言</text>
  <text x="1430" y="682" text-anchor="middle" font-size="15" fill="#b8442a">直接說人話</text>
  <line x1="952" y1="660" x2="968" y2="660" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1082" y1="660" x2="1098" y2="660" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1192" y1="660" x2="1208" y2="660" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="1322" y1="660" x2="1358" y2="660" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- 舊路徑：轉成指令直接進電腦 -->
  <path d="M1265 623 C 1265 560, 1330 520, 1376 520" fill="none" stroke="#5a534b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1300" y="552" font-size="15" fill="#5a534b" text-anchor="end">轉成指令</text>
  <!-- 新路徑：人話進 AI 模型 -->
  <path d="M1430 623 C 1430 560, 1440 500, 1470 482" fill="none" stroke="#b8442a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="1448" y="560" font-size="15" fill="#b8442a">聽懂人話</text>
  <!-- 人 → 自然語言 -->
  <path d="M330 497 L 330 775 L 1430 775 L 1430 697" fill="none" stroke="#b8442a" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="600" y="766" text-anchor="middle" font-size="17" fill="#b8442a">人直接用人話控制電腦</text>

  <!-- 電腦：AI 模型 + 執行指令 -->
  <rect x="1380" y="320" width="180" height="240" rx="14" fill="#fff" stroke="#14110e" stroke-width="3"/>
  <line x1="1380" y1="470" x2="1560" y2="470" stroke="#14110e" stroke-width="2"/>
  <text x="1470" y="306" text-anchor="middle" font-size="19" fill="#5a534b">電腦</text>
  <text x="1470" y="380" text-anchor="middle" font-size="24" font-weight="700">AI 模型</text>
  <text x="1470" y="408" text-anchor="middle" font-size="16" fill="#5a534b">讀過全部紀錄</text>
  <text x="1470" y="431" text-anchor="middle" font-size="16" fill="#5a534b">把人話轉成指令</text>
  <line x1="1470" y1="446" x2="1470" y2="468" stroke="#b8442a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="1470" y="522" text-anchor="middle" font-size="22" font-weight="700">執行指令</text>

  <!-- 機器人與迴圈 -->
  <rect x="1620" y="405" width="150" height="90" rx="12" fill="#fff" stroke="#5a534b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="1695" y="443" text-anchor="middle" font-size="24" font-weight="700">機器人</text>
  <text x="1695" y="474" text-anchor="middle" font-size="16" fill="#5a534b">感測、行動</text>
  <line x1="1562" y1="450" x2="1618" y2="450" stroke="#5a534b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <path d="M1695 497 L 1695 845 L 120 845 L 120 524" fill="none" stroke="#5a534b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="900" y="835" text-anchor="middle" font-size="17" fill="#5a534b">未來：自己蒐集第一手資訊，與真實世界對應</text>

  <!-- 人的角色 -->
  <text x="900" y="905" text-anchor="middle" font-size="24" font-weight="700" fill="#b8442a">人仍是理解宇宙的一環——繼續探索，別浪費了大腦與身體這樣的寶藏</text>
  <text x="900" y="945" text-anchor="middle" font-size="20" fill="#5a534b">未來要學的，是理解宇宙的真理，以及人類思想與情感的基本要素；中間過渡的知識可以淘汰</text>
</svg>
