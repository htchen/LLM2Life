name: 發布專案網站

# 專案首頁與兩份課前準備頁發布到 GitHub Pages。
#   /                        ← web/index.html
#   /pre-workshop.html       ← variant-free/site/pre-workshop.html（免費版 · 主線）
#   /pre-workshop-paid.html  ← site/pre-workshop.html（付費版）
# 隨堂網站不在這裡發布——兩個版本各有自己的固定網址，見 CLAUDE.md。
#
# 首次啟用需要在 GitHub 上設定一次：
#   Settings → Pages → Build and deployment → Source 選 "GitHub Actions"
#
# 要手動重新發布時，請用 Actions → 本 workflow → "Run workflow"（branch: main）。
# 不要用舊 run 的 "Re-run jobs"：重跑會沿用那次 run 原本的 commit 重建，
# 完成得比較晚時會把新版蓋掉。下面的「確認發布的是 main 最新 commit」就是擋這件事。

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'site/pre-workshop.html'
      - 'variant-free/site/pre-workshop.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個發布，且不中斷進行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 確認發布的是 main 的最新 commit
        run: |
          set -euo pipefail
          TIP=$(git ls-remote origin refs/heads/main | cut -f1)
          HERE=$(git rev-parse HEAD)
          echo "這次 run 的 commit : $HERE"
          echo "main 目前的 commit : $TIP"
          if [ "$TIP" != "$HERE" ]; then
            echo "::error::這次 run 帶的是舊的 commit，發布會覆蓋掉較新的版本，因此中止。"
            echo "::error::如果你是用舊 run 的 Re-run jobs，請改用 Run workflow（branch: main）觸發新的 run。"
            exit 1
          fi

      - name: 組合要發布的檔案
        run: |
          set -euo pipefail
          mkdir -p public
          cp web/index.html public/index.html
          cp variant-free/site/pre-workshop.html public/pre-workshop.html
          cp site/pre-workshop.html public/pre-workshop-paid.html
          touch public/.nojekyll
          ls -l public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
